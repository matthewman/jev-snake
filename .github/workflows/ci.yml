name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test, build, and verify the raw results
        run: npm run check
      - name: Generate the offline sample without an API key
        run: npm run sample
      - name: Verify sample recording
        run: npm run verify -- recordings/offline-sample.json
      - name: Analyze the synthetic sample
        run: npm run analyze -- recordings/offline-sample.json
